services:
  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    container_name: qrshield-backend
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80,http://localhost:5173,http://127.0.0.1:5173
      - MAX_UPLOAD_SIZE_BYTES=10485760
      - LOG_LEVEL=INFO
      - DEBUG=false
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
      args:
        - VITE_API_BASE=http://localhost:8000
    container_name: qrshield-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
