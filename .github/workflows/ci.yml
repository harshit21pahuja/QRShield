name: QRShield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-test-and-lint:
    name: Backend Tests & Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Compile and verify Python syntax
        run: |
          python -m compileall src backend tests

      - name: Run fast mocked unit and security tests
        run: |
          pytest tests/test_api_mocked.py tests/test_security.py -v

  frontend-lint-and-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run oxlint linter
        working-directory: frontend
        run: npm run lint

      - name: Run production Vite build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE: http://localhost:8000
